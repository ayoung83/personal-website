<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #0a0a0a;
    --paper: #f2ede6;
    --red: #e63946;
    --tan: #c9b99a;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
    opacity: 0.4;
  }

  .stamp {
    position: absolute;
    top: 2rem;
    right: 2rem;
    width: 80px;
    height: 80px;
    border: 3px solid var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--red);
    opacity: 0;
    transform: rotate(15deg) scale(0.6);
    animation: stampIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.4s forwards;
    line-height: 1.4;
    text-align: center;
    padding: 0.5rem;
  }

  .line-top {
    position: absolute;
    top: 3rem;
    left: 2rem;
    right: 7rem;
    height: 2px;
    background: var(--ink);
    transform-origin: left;
    transform: scaleX(0);
    animation: drawLine 0.6s ease 0.2s forwards;
  }

  .line-bottom {
    position: absolute;
    bottom: 3rem;
    left: 2rem;
    right: 2rem;
    height: 1px;
    background: var(--tan);
    transform-origin: left;
    transform: scaleX(0);
    animation: drawLine 0.6s ease 0.3s forwards;
  }

  .meta {
    position: absolute;
    top: 3.6rem;
    left: 2rem;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--tan);
    opacity: 0;
    animation: fadeUp 0.5s ease 0.7s forwards;
  }

  .main {
    text-align: center;
    position: relative;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 20vw, 14rem);
    line-height: 0.9;
    letter-spacing: 0.02em;
    overflow: hidden;
  }

  .word {
    display: block;
    clip-path: inset(0 0 100% 0);
    animation: revealWord 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .word:nth-child(1) { animation-delay: 0.5s; color: var(--ink); }
  .word:nth-child(2) {
    animation-delay: 0.75s;
    color: var(--red);
    -webkit-text-stroke: 0px;
  }

  .sub {
    margin-top: 1.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--tan);
    opacity: 0;
    animation: fadeUp 0.5s ease 1.2s forwards;
  }

  .cursor {
    display: inline-block;
    width: 0.5em;
    height: 0.9em;
    background: var(--red);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 1s step-end 1.5s infinite;
    opacity: 0;
  }

  .footnote {
    position: absolute;
    bottom: 3.8rem;
    left: 2rem;
    font-size: 0.6rem;
    font-style: italic;
    color: var(--tan);
    opacity: 0;
    animation: fadeUp 0.5s ease 1.5s forwards;
  }

  @keyframes revealWord {
    to { clip-path: inset(0 0 0% 0); }
  }
  @keyframes drawLine {
    to { transform: scaleX(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes stampIn {
    to { opacity: 0.85; transform: rotate(12deg) scale(1); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="line-top"></div>
  <span class="meta">transmission #001 — initiated</span>
  <div class="stamp">first<br>contact<br>✦</div>

  <main class="main">
    <h1>
      <span class="word">Hello</span>
      <span class="word">World</span>
    </h1>
    <p class="sub">your first page is live<span class="cursor"></span></p>
  </main>

  <p class="footnote">built on phone · deployed to earth</p>
  <div class="line-bottom"></div>
<script src="/nav.js"></script>
</body>
</html>
